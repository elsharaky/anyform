name: Release

# Triggered when the Version workflow tags `main` with vX.Y.Z.
# Publishes the GitHub Release for that tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true
      - name: Build
        run: go build ./...
      - name: Run tests
        run: go test -race ./...
      - name: Create release / publish tags
        run: |
          set -e
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
