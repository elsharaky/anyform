name: CI

# Merging a pull request into `main` requires these checks to pass
# (enforced by a branch protection rule on the `ci` check).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write # for SARIF upload from gosec

jobs:
  quality:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)" || (echo "gofmt needs fixing:"; gofmt -l .; exit 1)

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --timeout=5m

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck -scan=module

      - name: gosec
        uses: securego/gosec@v2.22.0
        with:
          args: '-fmt sarif -out /tmp/gosec.sarif ./...'

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: /tmp/gosec.sarif
