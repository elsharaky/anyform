name: Version

# Trigger on every push to `main` — NOT on `pull_request: closed`.
# semantic-release refuses to publish on any pull_request event (even
# `closed`): env-ci reports isPr=true and its core logs "This run was
# triggered by a pull request and therefore a new version won't be
# published." Only a push event (isPr=false) can release, so merging a PR
# necessarily goes through this path: the merge itself is a push to `main`.
#
# The marker model is unchanged (see .releaserc): each run analyzes the
# commits in the release window since the last tag. Work commits
# (feat/fix/perf/breaking) are pinned to `release: false`, so they ACCUMULATE
# silently and never release by themselves; an explicit release-marker commit
# (`release(patch|minor|major): ...`) is the only thing that publishes,
# bumping from the last tag and including every accumulated work commit since
# it in the changelog.
#
# "Changelog" here means the release body semantic-release generates, which is
# NOT the project's changelog record. That is CHANGELOG.md, written by hand —
# see CONTRIBUTING.md ("Changelog") and the note on the Semantic Release step.
#
# Tag pushes (refs/tags/*) do not match `branches: [main]`, so semantic-release
# pushing the next tag never re-triggers this workflow.
on:
  push:
    branches: [main]

# Serialize release runs: if two PRs merge close together, only one job may
# compute and push a tag at a time. Do not cancel an in-flight release.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # to create tags and GitHub releases

jobs:
  release:
    name: Semantic Release
    # The repo guard keeps this job from running in forks.
    # NOTE: github.actor != 'github-actions[bot]' is defense-in-depth only and
    # not a functional safeguard against loops — on push the actor is the
    # person who pushed the merge, never the release bot.
    if: github.repository == 'elsharaky/goform' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      # Check out the merged state of `main` (not the PR head) so release
      # analysis runs against the code that actually landed.
      #
      # IMPORTANT: check out with RELEASE_TOKEN, not the default GITHUB_TOKEN.
      # The default token is a GitHub App credential that GitHub hard-blocks
      # from pushing any ref whose range touches .github/workflows/ — no
      # `permissions: contents: write` lifts that, because the token has no
      # `workflows` scope. The seed step and semantic-release both push git
      # tags; a tag pointing at the root commit (which creates the workflow
      # files) makes the default GITHUB_TOKEN push fail with a remote-reject.
      # RELEASE_TOKEN is a fine-grained PAT (Contents: read/write,
      # Workflows: read/write, scoped to this repo) stored as a repo secret;
      # wiring it here means every later git operation in this job uses it.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Run tests
        # Sanity re-run before tagging; the real quality gate (vet, lint,
        # gosec, govulncheck, race tests) is the required `ci` check on the PR
        # itself, enforced by branch protection.
        run: go test -race ./...

      # semantic-release hardcodes the very first release to 1.0.0, but we
      # want 0.1.0. Seed an annotated v0.0.0 baseline tag on the root commit
      # only when no release tag exists yet, so the first release-marker
      # (`release(minor)`) bumps 0.0.0 -> 0.1.0.
      - name: Seed baseline version tag
        run: |
          if [ -z "$(git tag --list 'v[0-9]*')" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            root="$(git rev-list --max-parents=0 HEAD)"
            git tag -a v0.0.0 "$root" -m 'v0.0.0 baseline before first release'
            git push origin v0.0.0
          fi

      # Reads .releaserc (commit-analyzer, release-notes-generator, github):
      # analyzes Conventional Commits since the last tag. Normal work commits
      # (feat/fix/perf/breaking) are mapped to `release: false`, so they only
      # accumulate. A release happens only when the merged PR includes a
      # `release(patch|minor|major): ...` marker commit — its scope decides
      # the bump and the changelog includes every accumulated work commit.
      #
      # The github plugin publishes the release only; the plugin is instantiated
      # with the conventionalcommits preset. semantic-release v24 has the angular
      # preset built in, but conventionalcommits is an external package that must
      # be pre-installed (pinned to the v8 line compatible with semantic-release >= 24).
      #
      # THE GENERATED BODY IS NOT THE RECORD. `CHANGELOG.md` is, and it is
      # maintained by hand under `## [Unreleased]` in the same PR as the change
      # (Keep a Changelog). This step cannot write that file usefully: the preset
      # hardcodes `docs`/`chore`/`ci`/`refactor` as hidden, so a window holding
      # only those types produces an empty body — which is what happened on
      # v0.1.0, and again on v0.1.1. It also has only commit subjects to work
      # from, so it cannot state what a change means for a reader.
      #
      # Consequence for whoever ships a release: after this step publishes, open
      # the new release, compare its body against the matching section of
      # CHANGELOG.md, and paste that section in if the generated body is thinner.
      # Do NOT add `presetConfig` or a changelog plugin to automate this — see
      # CONTRIBUTING.md ("Changelog") and docs/MAINTAINER.md section 11.3.
      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: |
            conventional-changelog-conventionalcommits@8.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}