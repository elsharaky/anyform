name: Version

# On every push/merge to `main`, bump the semantic version based on the
# commit message(s) and push a `vX.Y.Z` tag (Conventional Commits).
# The accompanying GitHub Release is created by release.yml reacting to the tag.
on:
  push:
    branches: [main]

permissions:
  contents: write # to create tags on main

jobs:
  bump:
    name: Semantic Version Bump
    runs-on: ubuntu-latest
    if: github.repository == 'elsharaky/anyform' && github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Run tests
        run: go test -race ./...

      # Reads .releaserc: commits since last tag -> major/minor/patch bump,
      # then @semantic-release/git tags main with vX.Y.Z.
      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        with:
          branch: main
          extra_plugins: |
            @semantic-release/changelog@6.0.3
            @semantic-release/git@10.0.1
          dry_run: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
