name: Version

# On every push/merge to `main`, bump the semantic version based on the
# commit message(s) (Conventional Commits), tag main with vX.Y.Z, and
# publish the GitHub Release — all handled by semantic-release per .releaserc.
on:
  push:
    branches: [main]

permissions:
  contents: write # to create tags and GitHub releases

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: github.repository == 'elsharaky/anyform' && github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Run tests
        run: go test -race ./...

      # Reads .releaserc (commit-analyzer, release-notes-generator, github):
      # analyzes Conventional Commits since the last tag, generates structured
      # release notes, tags main with vX.Y.Z, and publishes the GitHub Release.
      #
      # .releaserc uses the `conventionalcommits` preset, which lives in
      # `conventional-changelog-conventionalcommits`. semantic-release v24 has
      # the angular preset built in, but the conventionalcommits preset is an
      # external package that must be pre-installed (pinned to the v8 line that
      # is compatible with semantic-release >= 24).
      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            conventional-changelog-conventionalcommits@8.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}